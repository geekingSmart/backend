<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>DDoS the Boss - Le Jeu</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #111; color: #fff; margin-top: 50px; }
        .hp-bar { width: 50%; height: 30px; background: #333; margin: 20px auto; border-radius: 5px; overflow: hidden; border: 2px solid #555; }
        .hp-fill { height: 100%; background: #e74c3c; width: 100%; transition: width 0.2s; }
        button { padding: 15px 25px; font-size: 16px; margin: 10px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; }
        .btn-1 { background: #3498db; color: white; }
        .btn-2 { background: #2ecc71; color: white; }
        .btn-3 { background: #e67e22; color: white; }
        .btn-4 { background: #9b59b6; color: white; }
    </style>
</head>
<body>

    <h1>💥 LE BOSS DU SERVEUR 💥</h1>
    <p>Le serveur se régénère de 500 PV/s. Coordonnez-vous pour le faire tomber !</p>

    <div class="hp-bar">
        <div id="hpFill" class="hp-fill"></div>
    </div>
    <h2 id="hpText">100000 / 100000 PV</h2>

    <div>
        <button class="btn-1" onclick="hit(1)">1. Requête HTTP (1 dégât)</button>
        <button class="btn-2" onclick="hit(2)">2. Bouton Tactique (5 min | x² - x)</button>
    </div>
    <div>
        <button class="btn-3" onclick="hit(3)">3. Bouton Chaotique (1 min | x³ - x² - x)</button>
        <button class="btn-4" onclick="hit(4)">4. Bouton Nucléaire (30s | x⁴ - x³ - x² - x)</button>
    </div>

    <p id="log" style="margin-top: 30px; font-style: italic; color: #aaa;"></p>

    <script>
        async function fetchBoss() {
            const res = await fetch('/api/boss');
            const data = await res.json();
            updateUI(data);
        }

        async function hit(buttonId) {
            const res = await fetch(`/api/hit/${buttonId}`, { method: 'POST' });
            const data = await res.json();
            if (data.erreur) {
                document.getElementById('log').innerText = data.erreur;
            } else {
                document.getElementById('log').innerText = `Dernier coup (Bouton ${buttonId}) : ${data.degats > 0 ? '-' + data.degats : '+' + Math.abs(data.degats)} PV !`;
            }
            fetchBoss();
        }

        function updateUI(boss) {
            const percent = (boss.hp / boss.maxHp) * 100;
            document.getElementById('hpFill').style.width = percent + '%';
            document.getElementById('hpText').innerText = `${boss.hp} / ${boss.maxHp} PV`;
        }

        // Rafraîchir les PV toutes les secondes
        setInterval(fetchBoss, 1000);
        fetchBoss();
    </script>
</body>
</html>
